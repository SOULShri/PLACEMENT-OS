version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: placement-postgres
    environment:
      POSTGRES_DB: placementos
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: placement-redis
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  chromadb:
    image: chromadb/chroma:latest
    container_name: placement-chromadb
    ports:
      - "8001:8000"
    volumes:
      - chromadata:/chroma/chroma
    restart: unless-stopped
    environment:
      - ANONYMIZED_TELEMETRY=false

  ai-service:
    build:
      context: ./ai-service
      dockerfile: Dockerfile
    container_name: placement-ai-service
    ports:
      - "8000:8000"
    depends_on:
      chromadb:
        condition: service_started
    environment:
      - CHROMA_HOST=chromadb
      - CHROMA_PORT=8000
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

volumes:
  pgdata:
  redisdata:
  chromadata:
